services:
  sira-ma-agent:
    build: .
    image: sira-ma-cemac:latest
    container_name: sira-ma-cemac
    ports:
      - "8501:8501"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./app.py:/app/app.py:ro          # rechargement rapide en développement
      - ./core:/app/core:ro
    restart: unless-stopped
